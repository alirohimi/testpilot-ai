name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  PYTHON_VERSION: '3.13'
  PYTHONPATH: src
  TESTING: '1'

jobs:
  # =====================
  # LINT & FORMAT
  # =====================
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run Ruff
      run: ruff check api/ src/testpilot_ai/ tests/

    - name: Run Black
      run: black --check api/ src/testpilot_ai/ tests/

    - name: Run MyPy (advisory — does not block CI)
      continue-on-error: true
      run: |
        mypy --ignore-missing-imports api/ src/testpilot_ai/ \
          || echo "::warning::mypy reported issues (advisory, not blocking CI)"

  # =====================
  # TEST
  # =====================
  test:
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[test]"

    - name: Run tests
      run: |
        pytest tests/ -v --tb=short --cov=api --cov=src.testpilot_ai \
          --cov-report=xml --cov-report=term-missing

    - name: Upload coverage
      # Advisory only — a codecov hiccup (rate limit, missing token) must not
      # turn CI red. The real gate is the test step above.
      continue-on-error: true
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml

  # =====================
  # BUILD & PUSH DOCKER
  # =====================
  build:
    needs: [test]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
