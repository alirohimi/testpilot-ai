# TestPilot AI - Production Deployment Configuration
# Fly.io Deployment
# ==================

[build]
builder = "nixpacks"

[env]
PYTHON_VERSION = "3.11"
PORT = "8000"

[deploy]
main_process = "uvicorn api.main:app --host 0.0.0.0 --port $PORT"
signal = "SIGTERM"
restart_policy = "on-failure"
restart_delay = 5
max_restarts = 10

[http_service]
internal_port = 8000
force_https = true
auto_stop_machines = true
auto_start_machines = true
min_machines_running = 0

[[vm]]
memory = "512MB"
cpu_kind = "shared"
cpus = 1

# Database
[[services]]
internal_port = 5432
protocol = "tcp"

[services.ports]
handlers = ["postgres"]

# Redis
[[services]]
internal_port = 6379
protocol = "tcp"

[services.ports]
handlers = ["redis"]
