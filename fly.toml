# TestPilot AI - Production Deployment Configuration
# Fly.io Deployment
# ==================

app = "testpilot-ai-tb8dcq"
primary_region = "lax"
main_process = "uvicorn api.main:app --host 0.0.0.0 --port 8000"

[build]
  builder = "docker"

[env]
  PORT = "8000"
  PYTHON_VERSION = "3.13"
  TESTING = "0"

[deploy]
  signal = "SIGTERM"
  restart_policy = "on-failure"
  restart_delay = 5
  max_restarts = 10

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1

[vm]
  memory = "512MB"
  cpu_kind = "shared"
  cpus = 1
