[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "testpilot-ai"
version = "0.1.0"
description = "AI-powered pytest plugin for intelligent test failure triage"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "Hermes Agent", email = "agent@hermes.ai"}
]
dependencies = [
    "pytest>=7.0.0",
    "pydantic>=2.0.0",
    "openai>=1.0.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
]

[project.entry-points."pytest11"]
testpilot = "testpilot_ai.plugin"

[tool.setuptools.packages.find]
where = ["src"]
